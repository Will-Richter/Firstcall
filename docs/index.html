<title>Firstcall Lead Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800;900&family=Red+Hat+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a navy masthead carrying the count of leads still waiting, then one column of lead cards under a sticky search and status strip.
   A lead opens as a sheet from the bottom on phones and from the right on wide screens.
   Type: Red Hat Display for names and numbers, Red Hat Text for everything else. Spacing 4 8 12 16 24. Corners 18 cards, 12 controls, full pills. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#141A40; --muted:#5B6287; --line:#E3E6F0; --line-2:#C8CDE0;
  --tint:rgba(20,26,64,.06); --tint-2:rgba(20,26,64,.11);
  --hero:#141A40; --hero-2:#212B6B; --hero-ink:#FFFFFF; --hero-muted:#B9BFE0; --hero-line:rgba(255,255,255,.14);
  --accent:#F58220; --accent-ink:#141A40; --accent-soft:#FDEBD8; --accent-deep:#A64D05;
  --primary:#141A40; --primary-ink:#FFFFFF;
  --blue:#2450B8; --blue-soft:#E3EAFB; --violet:#5C3FB8; --violet-soft:#EBE6FA;
  --ok:#18733F; --ok-soft:#DEF3E6; --bad:#A3372F; --bad-soft:#F9E6E4; --amber:#855200; --amber-soft:#FBEFD3;
  --scrim:rgba(10,13,36,.52); --shadow:0 1px 2px rgba(20,26,64,.06),0 12px 32px rgba(20,26,64,.12);
  --font-display:"Red Hat Display","Red Hat Text",system-ui,sans-serif;
  --font-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --rc:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0D22; --surface:#131836; --surface-2:#191F44; --ink:#ECEEF9; --muted:#9AA1C6; --line:#242A54; --line-2:#363D70;
  --tint:rgba(236,238,249,.08); --tint-2:rgba(236,238,249,.14);
  --hero:#10153A; --hero-2:#1D2660; --hero-ink:#FFFFFF; --hero-muted:#AAB1D8; --hero-line:rgba(255,255,255,.12);
  --accent:#F58220; --accent-ink:#141A40; --accent-soft:#3B2611; --accent-deep:#FFAB5C;
  --primary:#F58220; --primary-ink:#141A40;
  --blue:#93B1F7; --blue-soft:#182650; --violet:#B9A6F5; --violet-soft:#261D52;
  --ok:#6FD39B; --ok-soft:#12301F; --bad:#F39088; --bad-soft:#3A1917; --amber:#EBB95E; --amber-soft:#35290F;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A0D22; --surface:#131836; --surface-2:#191F44; --ink:#ECEEF9; --muted:#9AA1C6; --line:#242A54; --line-2:#363D70;
  --tint:rgba(236,238,249,.08); --tint-2:rgba(236,238,249,.14);
  --hero:#10153A; --hero-2:#1D2660; --hero-ink:#FFFFFF; --hero-muted:#AAB1D8; --hero-line:rgba(255,255,255,.12);
  --accent:#F58220; --accent-ink:#141A40; --accent-soft:#3B2611; --accent-deep:#FFAB5C;
  --primary:#F58220; --primary-ink:#141A40;
  --blue:#93B1F7; --blue-soft:#182650; --violet:#B9A6F5; --violet-soft:#261D52;
  --ok:#6FD39B; --ok-soft:#12301F; --bad:#F39088; --bad-soft:#3A1917; --amber:#EBB95E; --amber-soft:#35290F;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.hero{position:relative;background:linear-gradient(155deg,var(--hero) 30%,var(--hero-2) 130%);color:var(--hero-ink);overflow:hidden}
.hero::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:25}
.hero-in{position:relative;max-width:820px;margin:0 auto;padding:14px 16px 26px;display:flex;flex-direction:column;gap:22px}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--font-display);letter-spacing:-.02em;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.syncbtn{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--hero-line);background:rgba(255,255,255,.07);color:var(--hero-ink);font-weight:600;font-size:13px;white-space:nowrap}
.syncbtn svg{width:15px;height:15px;flex:none}
.syncbtn.run svg{animation:spin 1s linear infinite}
.syncbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--hero-muted);flex:none}
.syncbtn.ok .dot{background:#5EDB9A} .syncbtn.err .dot{background:#FF8A7A}
.headline{display:flex;align-items:flex-end;gap:14px}
.bignum{font:900 76px/.86 var(--font-display);letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums;min-width:.6em}
.headline h1{margin:0 0 4px;font:700 21px/1.15 var(--font-display);letter-spacing:-.01em;text-wrap:balance;max-width:14em}
.headline p{margin:5px 0 0;font-size:14px;color:var(--hero-muted)}
.rings{position:absolute;right:-70px;top:-40px;width:330px;height:330px;pointer-events:none}
.rings path{fill:none;stroke-linecap:round;stroke:#fff;opacity:.06;stroke-width:12}
.rings path.hot{stroke:var(--accent);opacity:.5}
.progress{height:3px;background:transparent} .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}

/* tools */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.tools.stuck{border-bottom-color:var(--line)}
.tools-in{max-width:820px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.search{position:relative;display:block}
.search input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px 0 44px;font-size:16px}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:15px;top:15px;width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px} .chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-weight:600;font-size:13px;color:var(--muted);min-height:36px}
.chip b{font-weight:700;font-variant-numeric:tabular-nums;opacity:.75}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

main{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:6px 72px;display:flex;flex-direction:column;gap:12px}
#notices{display:flex;flex-direction:column;gap:8px}
#notices:empty{display:none}
.notice{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rc);padding:12px 14px;font-size:14px}
.notice.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.notice.err{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.notice .acts{display:flex;gap:8px;flex-wrap:wrap}
#list{display:flex;flex-direction:column;gap:10px}
.dayh{font:700 13px/1 var(--font-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:10px 2px 0}

/* lead card */
.lead{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st,transparent)}
.lead[data-st="new"]{--st:var(--accent)} .lead[data-st="contacted"]{--st:var(--blue)} .lead[data-st="quoted"]{--st:var(--violet)} .lead[data-st="won"]{--st:var(--ok)}
.lead-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 4px 14px 16px;border:0;background:none;text-align:left;min-width:0;width:100%}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 15px/1 var(--font-display);background:var(--tint);color:var(--ink);flex:none}
.lead[data-st="new"] .avatar{background:var(--accent-soft);color:var(--accent-deep)}
.lead-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.lead-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.lead .nm{font:700 17px/1.25 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.lead .when{margin-left:auto;flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lead-sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.lead-msg{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:0 10px;font-weight:600;font-size:12px;line-height:24px;white-space:nowrap;background:var(--tint);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.new{background:var(--accent-soft);color:var(--accent-deep)} .pill.contacted{background:var(--blue-soft);color:var(--blue)}
.pill.quoted{background:var(--violet-soft);color:var(--violet)} .pill.won{background:var(--ok-soft);color:var(--ok)}
.pill.lost{background:var(--bad-soft);color:var(--bad)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill svg{width:12px;height:12px}
.callbtn{display:grid;place-items:center;width:50px;height:50px;margin:0 14px 0 6px;border-radius:50%;background:var(--primary);color:var(--primary-ink);text-decoration:none;flex:none;border:0}
.callbtn svg{width:21px;height:21px}
.callbtn[aria-disabled="true"]{background:var(--tint);color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font:800 22px/1.15 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.empty p{margin:0;max-width:56ch;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--rc);border:0;background:var(--tint);font-weight:700;font-size:15px;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--tint-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink)} .btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px} .btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent-deep);font-weight:700;font-size:14px;text-decoration:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* loader: the mark rings */
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 16px;color:var(--muted);font-weight:500;text-align:center}
.loader svg{width:56px;height:56px}
.ld-a,.ld-b{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;animation:ring 1.3s ease-in-out infinite}
.ld-b{animation-delay:.18s}
.ld-1{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
@keyframes ring{0%,100%{opacity:.2}45%{opacity:1}}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 22px);z-index:41;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:4px;padding:8px 8px 6px;position:relative}
.sh-head::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line-2)}
.sh-head .t{flex:1;min-width:0;text-align:center;font-weight:700;font-size:14px;color:var(--muted);padding-top:8px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:0;background:none;border-radius:12px;flex:none;color:inherit;text-decoration:none}
.iconbtn:hover{background:var(--tint)} .iconbtn svg{width:20px;height:20px}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh-name{font:800 28px/1.1 var(--font-display);letter-spacing:-.025em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.sh-sub{margin:6px 0 0;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:3px;background:var(--tint);border-radius:14px}
.seg button{grid-column:span 2} .seg button:nth-child(n+4){grid-column:span 3}
.seg button{border:0;background:none;border-radius:11px;padding:9px 2px;font-size:14px;font-weight:700;color:var(--muted);min-height:42px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,64,.18)}
.seg button[aria-pressed="true"][data-st="new"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-st="contacted"]{background:var(--blue-soft);color:var(--blue)}
.seg button[aria-pressed="true"][data-st="quoted"]{background:var(--violet-soft);color:var(--violet)}
.seg button[aria-pressed="true"][data-st="won"]{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"][data-st="lost"]{background:var(--bad-soft);color:var(--bad)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;text-decoration:none;color:var(--ink);min-width:0}
.qa svg{width:22px;height:22px}
.qa.call{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.qa[aria-disabled="true"]{opacity:.45;pointer-events:none}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h3{margin:0;font:700 13px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.contact{display:flex;align-items:center;gap:8px;min-height:40px}
.contact+.contact{border-top:1px solid var(--line);padding-top:12px}
.contact .v{flex:1;min-width:0;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.contact .v small{display:block;font-size:12px;font-weight:600;color:var(--muted);user-select:none;-webkit-user-select:none}
.contact .iconbtn{background:var(--tint);width:38px;height:38px} .contact .iconbtn svg{width:17px;height:17px}
.kv{display:grid;grid-template-columns:minmax(84px,auto) minmax(0,1fr);gap:9px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.quote{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--accent);overflow-wrap:anywhere;white-space:pre-wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:var(--rc);background:var(--surface);padding:11px 12px;font-weight:400;font-size:16px;color:var(--ink);min-height:48px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:96px;resize:vertical;line-height:1.4}
.hint{margin:0;font-size:13px;color:var(--muted)}
.rowacts{display:flex;gap:8px;flex-wrap:wrap}
.aftercall{background:var(--accent-soft);border-color:transparent}
.aftercall h3{color:var(--accent-deep)}
.outc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outc .btn{background:var(--surface)}
.sm8{display:flex;align-items:center;gap:12px}
.sm8 .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tint);flex:none}
.sm8 .ic svg{width:22px;height:22px}
.sm8 .ic.ok{background:var(--ok-soft);color:var(--ok)} .sm8 .ic.warn{background:var(--amber-soft);color:var(--amber)}
.sm8 div{min-width:0;flex:1} .sm8 b{display:block;font-size:15px} .sm8 span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.log{display:flex;flex-direction:column;gap:8px;font-size:14px}
.log div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px} .log .num{color:var(--muted);font-size:13px;padding-top:1px}
.prev{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:10px} .prev:first-of-type{border-top:0;padding-top:0}
.prev b{font-size:13px;color:var(--muted)}
.tick{width:22px;height:22px}
.tick path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:0}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

/* opening: the tile drops in, the 1 is written, two rings go out, the name rises, the screen lifts away */
.splash{position:fixed;inset:0;z-index:100;background:#141A40;display:grid;place-items:center;animation:splashOut .5s cubic-bezier(.6,0,.3,1) 1.95s forwards}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:20px}
.s-logo{width:104px;height:104px;overflow:visible}
.s-tile{fill:#F58220;transform-origin:50px 50px;animation:sTile .55s cubic-bezier(.2,1.4,.4,1) both}
.s-one{fill:none;stroke:#141A40;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:sDraw .45s cubic-bezier(.65,0,.25,1) .4s forwards}

function countTo(n){var el=$("bignum"),from=S.shownNew;if(from===n){el.textContent=n;return}S.shownNew=n;cancelAnimationFrame(numT);
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=n;return}
  var t0=performance.now(),dur=Math.min(900,250+Math.abs(n-from)*40);
  (function step(t){var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);el.textContent=Math.round(from+(n-from)*k);if(k<1)numT=requestAnimationFrame(step);
    else{el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}})(t0);
}

  if(c==="server_not_connected"||c==="selection_required"||c==="server_not_found")return server+" isn't connected for this page. Add it in Claude Settings under Connectors, then try again.";
  if(c==="not_in_manifest"||c==="consent_required")return"This page hasn't been allowed to use "+server+". Try again and choose Allow when asked.";

function patchList(el,items){
  var old=new Map();Array.prototype.forEach.call(el.children,function(n){if(n.dataset&&n.dataset.id)old.set(n.dataset.id,n)});
  if(old.size!==el.children.length){el.innerHTML="";old.clear()}
  var prev=null;
  items.forEach(function(it){var n=old.get(it.id);old.delete(it.id);
    if(!n||n._h!==it.cmp){var t=document.createElement("div");t.innerHTML=n?it.cmp:it.html;var nn=t.firstChild;nn._h=it.cmp;nn.dataset.id=it.id;if(n)n.replaceWith(nn);n=nn}
    var want=prev?prev.nextSibling:el.firstChild;if(n!==want)el.insertBefore(n,want);prev=n});
  old.forEach(function(n){n.remove()});
}

  function page(token,n){var input={query:QUERY,pageSize:50};if(token)input.pageToken=token;
    return readCall(GM,"search_threads",input,{cache:false}).then(function(r){var p=(r&&r.payload)||{};if(typeof p!=="object")p={};
      threads=threads.concat(p.threads||[]);var next=p.nextPageToken||p.next_page_token;if(next&&n<5)return page(next,n+1)})}
  return page(null,0).then(function(){
    var have=allSubs(),perThread=new Map();have.forEach(function(d){perThread.set(d.tid,(perThread.get(d.tid)||0)+1)});
    var need=threads.filter(function(t){var ms=t.messages||[],count=t.messageCount||ms.length;
      return(perThread.get(String(t.id))||0)<count||ms.some(function(m){return!have.has(String(m.id))})});
    sy.total=need.length;renderMain();
    var i=0;
    function worker(){if(i>=need.length)return Promise.resolve();var t=need[i++];
      return readCall(GM,"get_thread",{threadId:t.id,messageFormat:"PLAIN_TEXT"},{cache:false}).then(function(r){
        var p=(r&&r.payload)||{},ms=(p&&p.messages)||[],chain=Promise.resolve();
        ms.forEach(function(m){if(!/squarespace/i.test(String(m.sender||""))||allSubs().has(String(m.id)))return;
          var d=toDoc(m,t.id);S.local.set(d.mid,d);added++;S.flash.add(leadKey(d));
          if(S.db)chain=chain.then(function(){return S.db.doc("subs/"+d.mid).set(d)}).catch(function(e){if(!sync.warned){sync.warned=true;toast(dbMsg(e))}})});
        return chain}).then(function(){sy.done++;renderMain();return worker()})}
    return Promise.all([worker(),worker(),worker()]);
  }).then(function(){
    S.meta.lastSyncAt=Date.now();if(S.db)S.db.doc("meta/app").set({lastSyncAt:S.meta.lastSyncAt}).catch(function(){});
    if(added)toast(plural(added,"new lead")+" in");else if(!auto)toast("Up to date");
  }).catch(function(e){sy.error=e||{code:"upstream_error"}}).then(function(){sy.running=false;renderMain();if(S.open)renderSheet(true)});
}
function sameName(a,b){a=clean(a).toLowerCase();b=clean(b).toLowerCase();if(!a||!b)return false;if(a===b)return true;var x=a.split(" "),y=b.split(" ");
  return x.length>1&&y.length>1&&x[x.length-1]===y[y.length-1]&&x[0].charAt(0)===y[0].charAt(0)}
function sm8Check(L){
  if(!S.mcp||S.sm8.check.has(L.key))return;var k=L.key;S.sm8.check.set(k,{state:"loading"});
  readCall(SM8,"search",{query:L.name},{cache:{staleTime:120000}}).then(function(r){
    var res=(r&&r.payload&&r.payload.results)||[],matches=[];
    res.forEach(function(x){if(String(x.id||"").indexOf("company-")!==0)return;var c=null;try{c=JSON.parse(x.text)}catch(e){}
      if(c&&c.name&&sameName(c.name,L.name))matches.push({name:clean(c.name),address:clean(c.address)})});
    S.sm8.check.set(k,{state:"done",matches:matches})
  }).catch(function(e){S.sm8.check.set(k,{state:"error",error:e})}).then(function(){if(S.open===k&&!S.add)swapSm8()});
}
function swapSm8(){var L=leadOf(S.open),el=$("sm8sec");if(!L||!el)return;var t=document.createElement("div");t.innerHTML=sm8HTML(L);el.replaceWith(t.firstChild)}
function loadTemplates(){
  if(S.sm8.templates||S.sm8.tplLoading)return;S.sm8.tplLoading=true;S.sm8.tplError=null;
  readCall(SM8,"list_job_templates",{},{cache:{staleTime:300000}}).then(function(r){
    var list=((r&&r.payload&&r.payload.job_templates)||[]).filter(function(t){return t&&t.uuid}).map(function(t){return{uuid:String(t.uuid),name:String(t.name||"Job")}});
    if(!list.length)throw{code:"tool_error",message:"no job templates found. Create one in ServiceM8 first."};
    S.sm8.templates=list;
    if(S.add&&!S.add.tpl){var want="";try{want=localStorage.getItem("fc-tpl")||""}catch(e){}
      var pick=list.find(function(t){return t.uuid===want})||list.find(function(t){return/solar/i.test(t.name)})||list[0];S.add.tpl=pick.uuid}
  }).catch(function(e){S.sm8.tplError=e||{code:"upstream_error"}}).then(function(){S.sm8.tplLoading=false;if(S.add&&S.open===S.add.key)swapSm8()});
}
function openAdd(){var L=leadOf(S.open);if(!L||!S.mcp)return;var ck=S.sm8.check.get(L.key),m=ck&&ck.state==="done"&&ck.matches[0];
  S.add={key:L.key,name:m?m.name:L.name,address:clean(L.address).replace(/,?\s*Australia$/i,""),desc:jobDesc(L),tpl:"",busy:false,error:""};
  if(S.sm8.templates){var want="";try{want=localStorage.getItem("fc-tpl")||""}catch(e){}
    var T=S.sm8.templates,pick=T.find(function(t){return t.uuid===want})||T.find(function(t){return/solar/i.test(t.name)})||T[0];S.add.tpl=pick.uuid}
  swapSm8();loadTemplates()}
function jobInfo(r){var p=r&&r.payload,s="";try{s=typeof p==="string"?p:JSON.stringify(p==null?(r&&r.content)||"":p)}catch(e){}
  var n=/"(?:job_number|generated_job_id|job_no)"\s*:\s*"?([A-Za-z0-9-]{1,12})/.exec(s)||/job\s*#?\s*(\d{2,7})\b/i.exec(s),u=/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i.exec(s);
  return{num:n?n[1]:"",uuid:u?u[0]:""}}
function createJob(){
  var a=S.add;if(!a||a.busy||!S.mcp)return;var key=a.key,T=S.sm8.templates||[],tpl=T.find(function(t){return t.uuid===a.tpl});
  a.name=clean(a.name);a.address=clean(a.address);a.error="";
  if(!a.name){a.error="Add the client's name first.";swapSm8();return}
  if(!a.address){a.error="ServiceM8 needs a job address. Add one, even just the suburb.";swapSm8();return}
  if(!tpl){a.error="Choose a job type.";swapSm8();return}
  a.busy=true;swapSm8();remember("fc-tpl",tpl.uuid);
  S.mcp.callTool(SM8,"create_job",{company_name:a.name,job_address:a.address,job_description:a.desc.trim()||"Website enquiry",job_template_uuid:tpl.uuid}).then(function(r){
    var info=jobInfo(r);S.add=null;S.sm8.check.delete(key);
    saveState(key,function(s){s.sm8={at:Date.now(),name:a.name,template:tpl.name,jobNumber:info.num,uuid:info.uuid};logLine(s,"Added to ServiceM8"+(info.num?" as job #"+info.num:""))});
    toast("Added to ServiceM8");
  }).catch(function(e){a.busy=false;var c=e&&e.code;
    a.error=(c==="server_unavailable"||c==="upstream_error"||c==="cancelled"||!c)?"ServiceM8 didn't confirm the job. Check ServiceM8 for "+a.name+" before trying again, so it isn't created twice.":mcpMsg(e,SM8);
    if(S.add===a&&S.open===key)swapSm8()});
}

/* ---------- actions ---------- */
function copyText(text,btn){
  function done(){toast("Copied")}
  function fallback(){var v=btn&&btn.parentNode&&btn.parentNode.querySelector(".v");if(v){var r=document.createRange();r.selectNodeContents(v);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Copy it from here.")}}
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}
function outcome(o){var key=S.open;S.afterCall=null;if(!key)return;
  if(o==="skip"){renderSheet(true);return}
  if(o==="noanswer"){saveState(key,function(s){s.attempts=(s.attempts||0)+1;logLine(s,"Called, no answer")});toast("Logged. Still on your list.");return}
  if(o==="spoke")setStatus(key,"contacted","Spoke on the phone, follow up needed");else if(o==="quoted")setStatus(key,"quoted","Spoke on the phone, quote given");
  else if(o==="won")setStatus(key,"won","Booked in over the phone");else if(o==="lost")setStatus(key,"lost","Not going ahead");
}
function archiveBacklog(){var old=LEADS.filter(function(L){return L.state.status==="new"&&Date.now()-L.at>14*864e5});
  old.forEach(function(L){var cur=clone(S.states.get(L.key));cur.status="archived";logLine(cur,"Archived with older leads");S.states.set(L.key,cur)});
  renderMain();toast(plural(old.length,"lead")+" archived");
  old.reduce(function(p,L){S.pending.set(L.key,(S.pending.get(L.key)||0)+1);
    return p.then(function(){return S.db?S.db.doc("leads/"+L.key).set(clone(S.states.get(L.key))):null}).catch(function(e){if(!archiveBacklog.w){archiveBacklog.w=true;toast(dbMsg(e))}})
      .then(function(){S.pending.set(L.key,Math.max(0,(S.pending.get(L.key)||1)-1))})},Promise.resolve());
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");if(!t)return;var act=t.dataset.act;
  if(act==="open")openLead(t.dataset.key);
  else if(act==="close")closeSheet();
  else if(act==="sync")sync(false);
  else if(act==="filter"){S.filter=t.dataset.f;remember("fc-filter",S.filter);S.seen.clear();renderMain();window.scrollTo({top:Math.min(window.scrollY,$("tools").offsetTop),behavior:"auto"})}
  else if(act==="status")setStatus(S.open,t.dataset.st);
  else if(act==="call"){var key=t.dataset.key;S.afterCall=key;setTimeout(function(){if(S.open===key)renderSheet(true);else openLead(key);var a=document.querySelector(".aftercall");if(a&&a.scrollIntoView)a.scrollIntoView({block:"nearest",behavior:"smooth"})},350)}
  else if(act==="outcome")outcome(t.dataset.o);
  else if(act==="copy")copyText(t.dataset.copy,t);
  else if(act==="sm8-open")openAdd();
  else if(act==="sm8-cancel"){S.add=null;swapSm8()}
  else if(act==="sm8-create")createJob();
  else if(act==="tpl-retry"){S.sm8.tplError=null;swapSm8();loadTemplates()}
  else if(act==="backlog")archiveBacklog();
  else if(act==="backlog-keep"){S.hideBacklog=true;remember("fc-backlog","1");renderMain()}
});
document.addEventListener("input",function(ev){var t=ev.target;
  if(t.id==="q"){S.q=t.value;S.seen.clear();build();renderList()}
  else if(t.id==="notes"){clearTimeout(S.noteT);S.noteT=setTimeout(flushNotes,900)}
  else if(t.dataset&&t.dataset.add&&S.add)S.add[t.dataset.add]=t.value;
});
document.addEventListener("change",function(ev){var t=ev.target;if(t.dataset&&t.dataset.add&&S.add)S.add[t.dataset.add]=t.value});
document.addEventListener("focusout",function(ev){if(ev.target.id==="notes")flushNotes()});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeSheet()});
$("splash").addEventListener("click",function(){this.classList.add("skip")});
window.addEventListener("scroll",function(){var t=$("tools");t.classList.toggle("stuck",t.getBoundingClientRect().top<=1+(parseFloat(getComputedStyle(t).top)||0))},{passive:true});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.mcp&&S.meta.lastSyncAt&&Date.now()-S.meta.lastSyncAt>6e5)sync(true)});
setInterval(function(){if(!document.hidden&&!S.sync.running){build();var c=counts();renderHero(c);if(!S.open)renderList()}},6e4);

/* ---------- start ---------- */
function typing(){var a=document.activeElement;return!!(a&&$("sheetwrap").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
function onData(){renderMain();if(S.open&&!typing()&&!(S.add&&S.add.busy))renderSheet(true)}
function start(){
  var c=window.claude,use=c&&c.use?function(n){return c.use(n).catch(function(){return null})}:function(){return Promise.resolve(null)};
  renderMain();
  Promise.all([use("db"),use("mcp")]).then(function(r){
    S.db=r[0];S.mcp=r[1];S.ready=true;
    if(!S.db){renderMain();if(S.mcp)sync(true);return}
    var first=true;
    S.db.collection("subs").limit(1000).onSnapshot(function(snap){
      var m=new Map();snap.docs.forEach(function(d){var x=d.data();if(x&&x.mid)m.set(d.id,x)});S.subs=m;S.subsLoaded=true;onData();
      if(first){first=false;if(S.mcp)sync(true)}
    },function(){S.subsLoaded=true;S.db=null;renderMain();if(first&&S.mcp){first=false;sync(true)}});
    S.db.collection("leads").limit(1000).onSnapshot(function(snap){
      snap.docs.forEach(function(d){if(!(S.pending.get(d.id)>0))S.states.set(d.id,d.data()||{})});onData();
    },function(){});
    S.db.doc("meta/app").get().then(function(d){var x=d.exists&&d.data();if(x&&x.lastSyncAt&&!S.meta.lastSyncAt){S.meta.lastSyncAt=x.lastSyncAt;renderMain()}}).catch(function(){});
  });
}
start();
})();
</script>
